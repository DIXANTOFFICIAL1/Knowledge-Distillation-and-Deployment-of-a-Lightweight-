# Kubernetes Secret for S3 Object Storage Credentials
# Note: Sensitive credentials must come only from Secrets, never committed plaintext in code.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: app
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "seaweedfs"
  AWS_SECRET_ACCESS_KEY: "seaweedfssecret"
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: data
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "seaweedfs"
  AWS_SECRET_ACCESS_KEY: "seaweedfssecret"
